name: Build & Test

on: [push, pull_request]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24.22.1, 26.12.1]
      fail-fast: false
      max-parallel: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Prepare Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate
          yarn --version
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, `YARN_CLI=${require("node:path").join(process.env.COREPACK_HOME, "v1/yarn/4.17.0/yarn.js")}\n`)'
        env:
          COREPACK_HOME: ${{ runner.temp }}/corepack
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        shell: bash
        run: node "$YARN_CLI" install --immutable --mode=skip-build
      - name: Build
        shell: bash
        run: node "$YARN_CLI" run rebuild
        env:
          npm_config_jobs: '2'
          MAKEFLAGS: -j2
      - name: Test release checks
        shell: bash
        run: node "$YARN_CLI" test:prebuilds
      - name: Test native runtime
        shell: bash
        run: node "$YARN_CLI" test
        env:
          CI: '1'
          TEST_TIMEOUT_MS: '60000'

  build-and-test-alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [24.22.1, 26.12.1]
      fail-fast: false
      max-parallel: 1
    steps:
      - uses: actions/checkout@v6
      - name: Test native runtime
        run: |
          docker run --rm --cpus=2 --memory=3g -v "$PWD:/work" -w /work node:24.22.1-alpine3.24 sh -ec '
            corepack prepare yarn@4.17.0 --activate
            cp /root/.cache/node/corepack/v1/yarn/4.17.0/yarn.js /work/.yarn-cli.cjs
          '
          docker run --rm --cpus=2 --memory=3g -v "$PWD:/work" -w /work -e CI=1 -e TEST_TIMEOUT_MS=60000 node:${{ matrix.node }}-alpine3.24 sh -ec '
            apk add --no-cache g++ make python3
            node .yarn-cli.cjs install --immutable --mode=skip-build
            npm_config_nodedir=/usr/local node .yarn-cli.cjs prebuild --current
            node .yarn-cli.cjs test:prebuilds
            node .yarn-cli.cjs test
          '
