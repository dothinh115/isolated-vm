name: Build prebuildify binaries

on:
  push:
    tags: ['*']
  workflow_dispatch:

jobs:
  prebuild:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v6
      - name: Use nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Add msbuild to PATH
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2
      - name: Dependencies
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate
          yarn install --immutable --mode=skip-build
      - name: Build
        run: yarn prebuild
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.os }}
          path: prebuilds

  prebuild-linux:
    strategy:
      matrix:
        arch: [ x64, arm64 ]
        os: [ debian, alpine ]
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v6
      - name: Use nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        run: |
          docker build . -f Dockerfile.${{ matrix.os }} --output prebuilds
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.arch }}
          path: prebuilds

  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs: [prebuild, prebuild-linux]
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Use nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Download all prebuild artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: prebuilds-*
          merge-multiple: true
          path: prebuilds
      - name: Verify bundled prebuilds
        run: node scripts/verify-prebuilds.js
      - name: Pack npm tarball
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate
          yarn install --immutable --mode=skip-build
          yarn pack --out enfyra-isolated-vm.tgz
      - name: Upload npm tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: '*.tgz'
      - name: Publish
        if: github.repository_owner == 'laverdet'
        run: npm publish
